<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Magalhães Barbearia - Gestão</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg-body: #f8fafc;
      --card-bg: #ffffff;
      --gold-primary: #d4af37;
      --gold-light: #fef9e7;
      --gold-border: #f1df99;
      --text-dark: #1e293b;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
      --success: #16a34a;
      --shadow: 0 4px 12px rgba(0, 0, 0, 0.05);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
    body { background-color: var(--bg-body); color: var(--text-dark); min-height: 100vh; display: flex; flex-direction: column; }

    header {
      background: var(--card-bg);
      border-bottom: 2px solid var(--gold-border);
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: var(--shadow);
    }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 1.2rem; color: #1e293b; }
    .brand span { color: var(--gold-primary); }

    .nav-tabs { display: flex; gap: 8px; }
    .nav-btn {
      background: none; border: 1px solid var(--gold-border);
      padding: 8px 16px; border-radius: 8px; font-weight: 600;
      cursor: pointer; transition: all 0.2s; color: var(--text-dark);
    }
    .nav-btn.active { background: var(--gold-primary); color: #fff; border-color: var(--gold-primary); }

    main { flex: 1; max-width: 600px; width: 100%; margin: 0 auto; padding: 16px; }

    /* Seletor de Data */
    .date-navigator {
      background: var(--card-bg);
      border: 1px solid var(--gold-border);
      border-radius: 12px;
      padding: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: var(--shadow);
      margin-bottom: 16px;
    }
    .date-navigator button {
      background: var(--gold-light);
      border: 1px solid var(--gold-border);
      color: var(--gold-primary);
      width: 40px; height: 40px; border-radius: 8px;
      cursor: pointer; font-size: 1rem;
    }
    .date-navigator input[type="date"] {
      font-size: 1.1rem; font-weight: bold; border: none;
      background: transparent; color: var(--text-dark); text-align: center;
    }

    /* Lista de Horários */
    .slot-list { display: flex; flex-direction: column; gap: 8px; }
    .slot-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: var(--shadow);
    }
    .slot-card.booked { border-left: 5px solid var(--gold-primary); background: #fffdf5; }
    .slot-card.finished { border-left: 5px solid var(--success); background: #f0fdf4; opacity: 0.85; }

    .slot-time { font-weight: 700; font-size: 1.1rem; width: 65px; color: var(--text-dark); }
    .slot-info { flex: 1; margin: 0 10px; }
    .slot-info .name { font-weight: 600; font-size: 1rem; }
    .slot-info .service { font-size: 0.8rem; color: var(--text-muted); }

    .btn-action {
      background: var(--gold-light); color: var(--gold-primary);
      border: 1px solid var(--gold-border); border-radius: 8px;
      padding: 6px 12px; cursor: pointer; font-weight: 600; font-size: 0.9rem;
    }
    .btn-finish { background: #dcfce7; color: var(--success); border-color: #86efac; }

    /* Separador Almoço */
    .lunch-divider {
      text-align: center; font-weight: 700; color: #b45309;
      background: #fef3c7; border: 1px dashed #f59e0b;
      padding: 8px; border-radius: 8px; margin: 6px 0;
      letter-spacing: 2px; font-size: 0.85rem;
    }

    /* Modal */
    .modal {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.4); justify-content: center; align-items: center;
      padding: 16px; z-index: 10;
    }
    .modal-content {
      background: white; border-radius: 12px; padding: 20px;
      width: 100%; max-width: 400px; box-shadow: 0 10px 25px rgba(0,0,0,0.1);
    }
    .modal-content h3 { margin-bottom: 12px; }
    .modal-content input {
      width: 100%; padding: 10px; margin-bottom: 10px;
      border: 1px solid var(--border-color); border-radius: 6px;
    }
    .modal-btns { display: flex; justify-content: flex-end; gap: 8px; margin-top: 10px; }

    /* Dashboard */
    .kpi-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 20px; }
    .kpi-card {
      background: var(--card-bg); border: 1px solid var(--gold-border);
      padding: 12px 8px; border-radius: 10px; text-align: center; box-shadow: var(--shadow);
    }
    .kpi-title { font-size: 0.75rem; color: var(--text-muted); font-weight: 600; text-transform: uppercase; }
    .kpi-value { font-size: 1.2rem; font-weight: 800; color: var(--gold-primary); margin-top: 4px; }
    .history-card { background: white; border-radius: 10px; padding: 14px; border: 1px solid var(--border-color); }
  </style>
</head>
<body>

  <header>
    <div class="brand"><i class="fa-solid fa-scissors" style="color:var(--gold-primary)"></i> MAGALHÃES <span>BARBEARIA</span></div>
    <div class="nav-tabs">
      <button class="nav-btn active" onclick="switchView('agenda')">Agenda</button>
      <button class="nav-btn" onclick="switchView('dashboard')">Faturamento</button>
    </div>
  </header>

  <main>
    <!-- ABA AGENDA -->
    <section id="view-agenda">
      <div class="date-navigator">
        <button onclick="changeDay(-1)"><i class="fa-solid fa-chevron-left"></i></button>
        <input type="date" id="currentDateInput" onchange="loadAgenda()">
        <button onclick="changeDay(1)"><i class="fa-solid fa-chevron-right"></i></button>
      </div>
      <div id="slotsContainer" class="slot-list"></div>
    </section>

    <!-- ABA DASHBOARD -->
    <section id="view-dashboard" style="display: none;">
      <div class="kpi-grid">
        <div class="kpi-card">
          <div class="kpi-title">Hoje</div>
          <div class="kpi-value" id="totalDay">R$ 0</div>
        </div>
        <div class="kpi-card">
          <div class="kpi-title">Semana</div>
          <div class="kpi-value" id="totalWeek">R$ 0</div>
        </div>
        <div class="kpi-card">
          <div class="kpi-title">Mês</div>
          <div class="kpi-value" id="totalMonth">R$ 0</div>
        </div>
      </div>
      <div class="history-card">
        <h4>Resumo de Cortes Concluídos</h4>
        <div id="finishedList" style="margin-top: 10px; font-size: 0.9rem; color: var(--text-muted);"></div>
      </div>
    </section>
  </main>

  <!-- MODAL AGENDAR -->
  <div class="modal" id="bookModal">
    <div class="modal-content">
      <h3 id="bookModalTitle">Novo Agendamento</h3>
      <input type="text" id="clientNameInput" placeholder="Nome do Cliente (ex: Seu Zé)">
      <input type="text" id="serviceInput" value="Cabelo / Barba" placeholder="Serviço">
      <input type="number" id="priceInput" placeholder="Valor Estimado (R$)" value="30.00">
      <div class="modal-btns">
        <button class="nav-btn" onclick="closeModal('bookModal')">Cancelar</button>
        <button class="nav-btn active" onclick="saveAppointment()">Agendar</button>
      </div>
    </div>
  </div>

  <!-- MODAL CONCLUIR -->
  <div class="modal" id="finishModal">
    <div class="modal-content">
      <h3>Concluir Corte</h3>
      <p id="finishClientName" style="margin-bottom: 10px; font-weight: 600;"></p>
      <input type="number" id="finishPriceInput" placeholder="Valor final cobrado (R$)">
      <div class="modal-btns">
        <button class="nav-btn" onclick="closeModal('finishModal')">Voltar</button>
        <button class="nav-btn active" onclick="confirmFinish()">Recebido & Salvar</button>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://rcbtpavqidddfzgdcfwh.supabase.co";
    const SUPABASE_KEY = "sb_publishable_JKkyHjxlcd3Ljd0yc63Oag_y9EomqIu";
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let currentDate = new Date().toISOString().split('T')[0];
    let dailyAppointments = [];
    let selectedSlot = null;
    let selectedAppointmentId = null;

    // Gerador de Horários (07:00 até 19:00 com intervalo de 30m)
    function generateTimes() {
      const times = [];
      for (let h = 7; h <= 19; h++) {
        const hh = h.toString().padStart(2, '0');
        times.push(`${hh}:00`);
        if (h < 19) times.push(`${hh}:30`);
      }
      return times;
    }

    window.onload = () => {
      document.getElementById('currentDateInput').value = currentDate;
      loadAgenda();
    };

    function changeDay(delta) {
      const d = new Date(currentDate + "T00:00:00");
      d.setDate(d.getDate() + delta);
      currentDate = d.toISOString().split('T')[0];
      document.getElementById('currentDateInput').value = currentDate;
      loadAgenda();
    }

    async function loadAgenda() {
      currentDate = document.getElementById('currentDateInput').value;
      const { data, error } = await supabase
        .from('agendamentos')
        .select('*')
        .eq('data', currentDate);

      dailyAppointments = data || [];
      renderSlots();
    }

    function renderSlots() {
      const container = document.getElementById('slotsContainer');
      container.innerHTML = '';
      const times = generateTimes();

      times.forEach((time) => {
        // Separador de Almoço às 12:45
        if (time === '13:00') {
          const div = document.createElement('div');
          div.className = 'lunch-divider';
          div.innerText = '----- ALMOÇO (12:45 - 13:00) -----';
          container.appendChild(div);
        }

        const app = dailyAppointments.find(a => a.hora === time);
        const card = document.createElement('div');
        card.className = `slot-card ${app ? (app.concluido ? 'finished' : 'booked') : ''}`;

        if (!app) {
          card.innerHTML = `
            <div class="slot-time">${time}</div>
            <div class="slot-info"><span style="color:var(--text-muted)">Livre</span></div>
            <button class="btn-action" onclick="openBookModal('${time}')"><i class="fa-solid fa-plus"></i></button>
          `;
        } else {
          card.innerHTML = `
            <div class="slot-time">${time}</div>
            <div class="slot-info">
              <div class="name">${app.cliente}</div>
              <div class="service">${app.servico} - R$ ${parseFloat(app.valor).toFixed(2)}</div>
            </div>
            ${app.concluido 
              ? `<span style="font-weight:700; color:var(--success); font-size:0.85rem;"><i class="fa-solid fa-check"></i> Pago</span>`
              : `<button class="btn-action btn-finish" onclick="openFinishModal(${app.id}, '${app.cliente}', ${app.valor})">Concluir</button>`
            }
          `;
        }
        container.appendChild(card);
      });
    }

    function openBookModal(time) {
      selectedSlot = time;
      document.getElementById('bookModalTitle').innerText = `Agendar às ${time}`;
      document.getElementById('clientNameInput').value = '';
      document.getElementById('bookModal').style.display = 'flex';
    }

    async function saveAppointment() {
      const cliente = document.getElementById('clientNameInput').value;
      const servico = document.getElementById('serviceInput').value;
      const valor = parseFloat(document.getElementById('priceInput').value) || 0;

      if (!cliente) return alert('Digite o nome do cliente');

      await supabase.from('agendamentos').insert([{
        data: currentDate,
        hora: selectedSlot,
        cliente,
        servico,
        valor,
        concluido: false
      }]);

      closeModal('bookModal');
      loadAgenda();
    }

    function openFinishModal(id, client, val) {
      selectedAppointmentId = id;
      document.getElementById('finishClientName').innerText = client;
      document.getElementById('finishPriceInput').value = val;
      document.getElementById('finishModal').style.display = 'flex';
    }

    async function confirmFinish() {
      const valorFinal = parseFloat(document.getElementById('finishPriceInput').value) || 0;

      await supabase.from('agendamentos')
        .update({ concluido: true, valor: valorFinal })
        .eq('id', selectedAppointmentId);

      closeModal('finishModal');
      loadAgenda();
    }

    function closeModal(id) {
      document.getElementById(id).style.display = 'none';
    }

    async function switchView(view) {
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
      if (view === 'agenda') {
        document.querySelector('.nav-btn:nth-child(1)').classList.add('active');
        document.getElementById('view-agenda').style.display = 'block';
        document.getElementById('view-dashboard').style.display = 'none';
        loadAgenda();
      } else {
        document.querySelector('.nav-btn:nth-child(2)').classList.add('active');
        document.getElementById('view-agenda').style.display = 'none';
        document.getElementById('view-dashboard').style.display = 'block';
        loadDashboard();
      }
    }

    async function loadDashboard() {
      const { data: records } = await supabase
        .from('agendamentos')
        .select('*')
        .eq('concluido', true);

      if (!records) return;

      const today = new Date().toISOString().split('T')[0];
      const startOfWeek = new Date();
      startOfWeek.setDate(startOfWeek.getDate() - startOfWeek.getDay());
      const currentMonth = today.slice(0, 7);

      let totalDay = 0, totalWeek = 0, totalMonth = 0;

      records.forEach(r => {
        const val = parseFloat(r.valor) || 0;
        if (r.data === today) totalDay += val;
        if (new Date(r.data + "T00:00:00") >= startOfWeek) totalWeek += val;
        if (r.data.startsWith(currentMonth)) totalMonth += val;
      });

      document.getElementById('totalDay').innerText = `R$ ${totalDay.toFixed(2)}`;
      document.getElementById('totalWeek').innerText = `R$ ${totalWeek.toFixed(2)}`;
      document.getElementById('totalMonth').innerText = `R$ ${totalMonth.toFixed(2)}`;

      const list = document.getElementById('finishedList');
      list.innerHTML = records.slice(-5).reverse().map(r => `
        <div style="display:flex; justify-content:space-between; padding:4px 0; border-bottom:1px solid #f1f5f9;">
          <span>${r.data.split('-').reverse().slice(0,2).join('/')} ${r.hora} - ${r.cliente}</span>
          <span style="font-weight:700; color:var(--gold-primary)">R$ ${parseFloat(r.valor).toFixed(2)}</span>
        </div>
      `).join('') || '<p>Nenhum corte registrado ainda.</p>';
    }
  </script>
</body>
</html>
