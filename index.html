<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#1a1509">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Barbearia Magalhães">
    
    <title>Barbearia Magalhães | Gestão</title>
    
    <!-- Bibliotecas: Supabase e Fontes -->
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg: #111009; --bg2: #1c1a10; --card: #201e12; --border: #3a3520;
            --gold: #c9a84c; --gold2: #e8c96d; --gold-dim: rgba(201,168,76,0.15);
            --text: #f0ead6; --text2: #9a8f6e; --text3: #5a5240;
            --red: #c0392b; --green: #27ae60; --radius: 12px;
        }

        * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
        body { background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; padding-bottom: 80px; }

        /* HEADER */
        .topbar {
            display: flex; align-items: center; justify-content: space-between;
            padding: 14px 16px; background: var(--bg2); border-bottom: 1px solid var(--border);
            position: sticky; top: 0; z-index: 100;
        }
        .logo-text { font-family: 'Playfair Display', serif; font-size: 16px; color: var(--gold2); }
        
        /* NAV */
        .nav-tabs { display: flex; gap: 8px; }
        .nav-btn { 
            background: transparent; border: 1px solid var(--border); color: var(--text2);
            padding: 6px 12px; border-radius: 8px; font-size: 12px; cursor: pointer;
        }
        .nav-btn.active { background: var(--gold); color: #111; font-weight: 600; border-color: var(--gold); }

        /* CARDS & STATS */
        .page { display: none; padding: 16px; animation: fadeIn 0.3s ease; }
        .page.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
        .stat-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; }
        .stat-label { font-size: 10px; text-transform: uppercase; color: var(--text3); letter-spacing: 1px; }
        .stat-value { font-family: 'Playfair Display', serif; font-size: 24px; color: var(--gold2); margin: 4px 0; }

        /* LISTS */
        .section-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; margin-bottom: 16px; }
        .item { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-bottom: 1px solid var(--border); }
        .item:last-child { border-bottom: none; }

        /* MODAL */
        .modal-overlay { 
            display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); 
            z-index: 200; align-items: flex-end; justify-content: center;
        }
        .modal-overlay.open { display: flex; }
        .modal { 
            background: var(--bg2); width: 100%; max-width: 500px; padding: 24px; 
            border-radius: 20px 20px 0 0; border: 1px solid var(--border);
        }
        
        /* FORM */
        input, select { 
            width: 100%; background: var(--bg); border: 1px solid var(--border); 
            color: var(--text); padding: 12px; border-radius: 8px; margin-top: 8px; outline: none;
        }
        input:focus { border-color: var(--gold); }
        .btn-primary { 
            background: var(--gold); color: #111; border: none; padding: 14px; 
            border-radius: 8px; font-weight: 700; width: 100%; cursor: pointer; margin-top: 16px;
        }

        /* TOAST */
        #toast { 
            position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%);
            background: var(--gold); color: #111; padding: 10px 20px; border-radius: 20px;
            font-size: 13px; font-weight: 600; display: none; z-index: 300;
        }
    </style>
</head>
<body>

<div class="topbar">
    <div class="logo">
        <div class="logo-text">Barbearia Magalhães</div>
    </div>
    <nav class="nav-tabs">
        <button class="nav-btn active" onclick="showPage('dashboard', this)">◈ Dash</button>
        <button class="nav-btn" onclick="showPage('agenda', this)">⊙ Agenda</button>
    </nav>
</div>

<!-- DASHBOARD -->
<div class="page active" id="page-dashboard">
    <div class="stats-grid">
        <div class="stat-card">
            <div class="stat-label">Hoje</div>
            <div class="stat-value" id="stat-hoje">R$ 0,00</div>
        </div>
        <div class="stat-card">
            <div class="stat-label">Este Mês</div>
            <div class="stat-value" id="stat-mes">R$ 0,00</div>
        </div>
    </div>

    <div class="section-card">
        <div style="padding: 16px; border-bottom: 1px solid var(--border); display:flex; justify-content:space-between;">
            <span style="font-size:11px; color:var(--text3); text-transform:uppercase;">Próximos da Lista</span>
            <button onclick="openModal()" style="background:none; border:none; color:var(--gold); cursor:pointer; font-weight:600;">+ Novo</button>
        </div>
        <div id="next-list">
            <!-- Dinâmico -->
        </div>
    </div>
</div>

<!-- AGENDA -->
<div class="page" id="page-agenda">
    <div style="margin-bottom: 16px; display: flex; justify-content: space-between; align-items: center;">
        <input type="date" id="agenda-filter" style="width: auto; margin:0;" onchange="fetchData()">
        <button class="nav-btn active" onclick="openModal()">+ Agendar</button>
    </div>
    <div class="section-card" id="agenda-list">
        <!-- Dinâmico -->
    </div>
</div>

<!-- MODAL AGENDAMENTO -->
<div class="modal-overlay" id="modalAgendamento">
    <div class="modal">
        <div style="display:flex; justify-content:space-between; margin-bottom: 20px;">
            <h2 style="font-family:'Playfair Display'; color:var(--gold2)">Novo Agendamento</h2>
            <button onclick="closeModal()" style="background:none; border:none; color:var(--text3); font-size:24px;">×</button>
        </div>
        
        <label style="font-size:12px; color:var(--text3)">Cliente</label>
        <input type="text" id="inp-cliente" placeholder="Nome do cliente">

        <label style="font-size:12px; color:var(--text3); margin-top:10px; display:block;">Serviço</label>
        <select id="inp-servico" onchange="updatePrice()"></select>

        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px; margin-top:10px;">
            <div>
                <label style="font-size:12px; color:var(--text3)">Data</label>
                <input type="date" id="inp-data">
            </div>
            <div>
                <label style="font-size:12px; color:var(--text3)">Hora</label>
                <input type="time" id="inp-hora">
            </div>
        </div>

        <label style="font-size:12px; color:var(--text3); margin-top:10px; display:block;">Valor (R$)</label>
        <input type="number" id="inp-valor" step="0.01">

        <button class="btn-primary" onclick="saveData()">💾 SALVAR NA NUVEM</button>
    </div>
</div>

<div id="toast"></div>

<script>
// CONFIGURAÇÃO SUPABASE
const SUPABASE_URL = 'SUA_URL_AQUI';
const SUPABASE_KEY = 'SUA_KEY_AQUI';
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let state = { agendamentos: [], servicos: [] };
let editingId = null;

// INICIALIZAÇÃO
async function init() {
    document.getElementById('inp-data').valueAsDate = new Date();
    document.getElementById('agenda-filter').valueAsDate = new Date();
    await fetchServicos();
    await fetchData();
}

async function fetchServicos() {
    const { data } = await supabaseClient.from('servicos').select('*');
    state.servicos = data || [];
    const sel = document.getElementById('inp-servico');
    sel.innerHTML = state.servicos.map(s => `<option value="${s.id}" data-preco="${s.preco}">${s.nome}</option>`).join('');
}

async function fetchData() {
    const { data } = await supabaseClient.from('agendamentos').select('*, servicos(*)').order('hora', { ascending: true });
    state.agendamentos = data || [];
    renderDashboard();
    renderAgenda();
}

function renderDashboard() {
    const hoje = new Date().toISOString().split('T')[0];
    const mes = new Date().getMonth();
    
    const totalHoje = state.agendamentos
        .filter(a => a.data === hoje && a.status === 'concluido')
        .reduce((acc, curr) => acc + Number(curr.valor_pago), 0);
        
    const totalMes = state.agendamentos
        .filter(a => new Date(a.data).getMonth() === mes && a.status === 'concluido')
        .reduce((acc, curr) => acc + Number(curr.valor_pago), 0);

    document.getElementById('stat-hoje').innerText = `R$ ${totalHoje.toFixed(2)}`;
    document.getElementById('stat-mes').innerText = `R$ ${totalMes.toFixed(2)}`;

    // Próximos
    const proximos = state.agendamentos.filter(a => a.status === 'agendado' && a.data >= hoje).slice(0, 5);
    const container = document.getElementById('next-list');
    
    if (proximos.length === 0) {
        container.innerHTML = '<div style="padding:20px; text-align:center; color:var(--text3)">Nenhum agendamento</div>';
        return;
    }

    container.innerHTML = proximos.map(a => `
        <div class="item">
            <div>
                <div style="font-weight:600">${a.cliente_nome}</div>
                <div style="font-size:11px; color:var(--text2)">${a.hora.slice(0,5)} · ${a.servicos?.nome || 'Corte'}</div>
            </div>
            <button onclick="changeStatus('${a.id}', 'concluido')" style="background:var(--gold-dim); border:1px solid var(--gold); color:var(--gold); padding:4px 8px; border-radius:6px; font-size:11px;">Finalizar</button>
        </div>
    `).join('');
}

function renderAgenda() {
    const filter = document.getElementById('agenda-filter').value;
    const lista = state.agendamentos.filter(a => a.data === filter);
    const container = document.getElementById('agenda-list');
    
    container.innerHTML = lista.map(a => `
        <div class="item" style="${a.status === 'concluido' ? 'opacity:0.5' : ''}">
            <div>
                <div style="color:var(--gold); font-weight:700">${a.hora.slice(0,5)}</div>
                <div style="font-weight:600">${a.cliente_nome}</div>
                <div style="font-size:11px; color:var(--text3)">${a.servicos?.nome} · R$ ${a.valor_pago}</div>
            </div>
            <div style="display:flex; gap:8px;">
                <button onclick="deleteData('${a.id}')" style="background:none; border:none; color:var(--red);">×</button>
            </div>
        </div>
    `).join('');
}

// AÇÕES
async function saveData() {
    const payload = {
        cliente_nome: document.getElementById('inp-cliente').value,
        servico_id: document.getElementById('inp-servico').value,
        data: document.getElementById('inp-data').value,
        hora: document.getElementById('inp-hora').value,
        valor_pago: document.getElementById('inp-valor').value,
        status: 'agendado'
    };

    const { error } = await supabaseClient.from('agendamentos').insert([payload]);
    if (!error) {
        showToast("Salvo com sucesso!");
        closeModal();
        fetchData();
    }
}

async function changeStatus(id, status) {
    await supabaseClient.from('agendamentos').update({ status }).eq('id', id);
    fetchData();
    showToast("Status atualizado!");
}

async function deleteData(id) {
    if(confirm("Remover agendamento?")) {
        await supabaseClient.from('agendamentos').delete().eq('id', id);
        fetchData();
    }
}

// UI UTILS
function showPage(id, btn) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
    document.getElementById('page-' + id).classList.add('active');
    btn.classList.add('active');
}

function openModal() { document.getElementById('modalAgendamento').classList.add('open'); updatePrice(); }
function closeModal() { document.getElementById('modalAgendamento').classList.remove('open'); }

function updatePrice() {
    const sel = document.getElementById('inp-servico');
    const preco = sel.options[sel.selectedIndex]?.dataset.preco;
    document.getElementById('inp-valor').value = preco || 0;
}

function showToast(m) {
    const t = document.getElementById('toast');
    t.innerText = m; t.style.display = 'block';
    setTimeout(() => t.style.display = 'none', 3000);
}

window.onload = init;
</script>
</body>
</html>
